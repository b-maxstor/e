<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات</title>

<!-- مكتبة Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Tahoma, sans-serif;
background:#f4f6f9;
padding:10px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

/* للشاشات الكبيرة */
@media(min-width:768px){
.grid{
grid-template-columns:repeat(3,1fr);
}
}

input,select{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
width:100%;
font-size:14px;
box-sizing: border-box;
}

button{
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:14px;
width:100%;
margin-top:5px;
}

/* للشاشات الكبيرة */
@media(min-width:768px){
button{
width:auto;
}
}

.save{background:#28a745;color:white}
.edit{background:#ffc107; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;}
.delete{background:#dc3545;color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;}
.logout{background:#333;color:white;float:none;margin-bottom:10px}
.btn-img{background:#17a2b8; color:white; width:100%; margin-top:0;}

/* للشاشات الكبيرة */
@media(min-width:768px){
.logout{float:left}
}

.table-container{
overflow-x:auto;
}

table{
min-width:700px;
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:13px;
vertical-align: middle;
}

th{
background:#007bff;
color:white;
}

.prod-img {
width: 40px;
height: 40px;
object-fit: cover;
border-radius: 5px;
border: 1px solid #ccc;
}

/* التنسيق الخاص بمعاينة ورفع الصور */
.image-selector-box {
display: flex;
align-items: center;
gap: 10px;
background: #f8f9fa;
border: 1px dashed #ccc;
padding: 5px 10px;
border-radius: 5px;
}

.image-preview-thumb {
width: 45px;
height: 45px;
object-fit: cover;
border-radius: 5px;
border: 1px solid #ddd;
background: #fff;
}

/* النافذة المنبثقة Modal */
.modal-overlay {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.5);
display: none;
justify-content: center;
align-items: center;
z-index: 1000;
}

.modal-content {
background: white;
padding: 20px;
border-radius: 10px;
width: 90%;
max-width: 450px;
box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">خروج</button>

<h2>إدارة المنتجات</h2>

<input type="text" id="searchBox" placeholder="بحث عن منتج أو قسم..." onkeyup="searchProduct()">

<br><br>

<div class="grid">

<input id="product_name" placeholder="اسم المنتج">

<input id="pay_qte" type="number" placeholder="كمية الشراء" oninput="autoCalculateStock()">

<input id="pice_qte" type="number" placeholder="عدد القطع" oninput="autoCalculateStock()">

<input id="qte_in_stock" type="number" placeholder="المخزون">

<input id="pay_price" type="number" step="0.01" placeholder="سعر الشراء">

<input id="seal_price" type="number" step="0.01" placeholder="سعر البيع">

<input id="commission" type="number" step="0.01" placeholder="العمولة">

<div>
    <label style="font-size: 11px; color: #666; display: block;">تاريخ الشراء:</label>
    <input id="pay_date" type="date">
</div>

<div>
    <label style="font-size: 11px; color: #666; display: block;">تاريخ الانتهاء:</label>
    <input id="expare_date" type="date">
</div>

<input id="req_id" placeholder="رقم الطلب">

<input id="coasts_value" type="number" step="0.01" placeholder="التكاليف">

<select id="id_cat">
    <option value="">جاري تحميل التصنيفات...</option>
</select>

<input id="department" placeholder="القسم (مثال: رجالي، نسائي)">

<!-- قسم اختيار ومعاينة الصورة -->
<div class="image-selector-box">
    <img id="imgPreview" src="https://via.placeholder.com/45?text=No+Img" class="image-preview-thumb">
    <div style="flex-grow: 1;">
        <button type="button" class="btn-img" onclick="openImageModal()">🖼️ اختيار / تغيير الصورة</button>
        <input type="hidden" id="image_url">
    </div>
</div>

</div>

<br>

<div style="display: flex; gap: 10px;">
    <button class="save" id="btnSave" onclick="saveProduct()">حفظ المنتج</button>
    <button type="button" onclick="clearForm()" style="background: #6c757d; color: white;">إلغاء / مسح الحقول</button>
</div>

<div class="table-container">
<table>

<thead>
<tr>
<th>الصورة</th>
<th>ID</th>
<th>المنتج</th>
<th>المخزون</th>
<th>سعر البيع</th>
<th>العمولة</th>
<th>الصنف / القسم</th>
<th>تعديل</th>
<th>حذف</th>
</tr>
</thead>

<tbody id="tableBody">
<tr><td colspan="9">جاري تحميل البيانات...</td></tr>
</tbody>

</table>
</div>

</div>

<!-- نافذة اختيار الصورة المنبثقة Modal -->
<div id="imageModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="margin-top:0; text-align:center;">إدراج / تغيير صورة المنتج</h3>
        
        <label style="font-size:12px; font-weight:bold;">1. رفع صورة من الجهاز:</label>
        <input type="file" id="fileInput" accept="image/*" style="margin-top:5px; margin-bottom:15px;">
        
        <div style="text-align:center; color:#888; margin-bottom:15px;">— أو —</div>
        
        <label style="font-size:12px; font-weight:bold;">2. إلصاق رابط صورة خارجي (URL):</label>
        <input type="url" id="urlInput" placeholder="https://example.com/image.jpg" style="margin-top:5px; margin-bottom:15px;">
        
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button type="button" onclick="applyImage()" style="background:#28a745; color:white; width:auto;">تطبيق</button>
            <button type="button" onclick="closeImageModal()" style="background:#6c757d; color:white; width:auto;">إلغاء</button>
        </div>
    </div>
</div>

<script>

// تهيئة الاتصال بـ Supabase
const supabaseUrl = "https://hjcaocvhzeejmglzjuub.supabase.co";
const supabaseKey = "sb_publishable_fLbGeBPrc94jjWEL0mZRbg_tNdOhFnd";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let edit_id = null;
let products = [];
let categories = [];
const fallbackImg = "https://via.placeholder.com/45?text=No+Img";

// 1. إدارة نافذة الصورة المعالجة
function openImageModal() {
    document.getElementById("urlInput").value = document.getElementById("image_url").value || "";
    document.getElementById("fileInput").value = "";
    document.getElementById("imageModal").style.display = "flex";
}

function closeImageModal() {
    document.getElementById("imageModal").style.display = "none";
}

function applyImage() {
    const fileInput = document.getElementById("fileInput");
    const urlInput = document.getElementById("urlInput").value.trim();

    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            setPreviewImage(e.target.result);
            closeImageModal();
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else if (urlInput !== "") {
        setPreviewImage(urlInput);
        closeImageModal();
    } else {
        alert("يرجى اختيار ملف أو إدخال رابط صورة");
    }
}

function setPreviewImage(src) {
    document.getElementById("image_url").value = src || "";
    document.getElementById("imgPreview").src = src || fallbackImg;
}

// 2. حساب المخزون تلقائياً
function autoCalculateStock() {
    const payQte = Number(document.getElementById("pay_qte").value) || 0;
    const piceQte = Number(document.getElementById("pice_qte").value) || 0;
    if (payQte > 0 && piceQte > 0) {
        document.getElementById("qte_in_stock").value = payQte * piceQte;
    }
}

// 3. تحميل الأصناف من جدول categories في Supabase
async function loadCategories(){
    try {
        const { data, error } = await supabaseClient
            .from('categories')
            .select('*');

        if (error) throw error;
        categories = data || [];

        let html = '<option value="">اختر الصنف...</option>';
        categories.forEach(c => {
            const catName = c.description_cat || c.name_cat || ('صنف ' + c.id_cat);
            html += `<option value="${c.id_cat}">${catName}</option>`;
        });

        document.getElementById("id_cat").innerHTML = html;
    } catch (err) {
        console.error("خطأ في تحميل الأصناف:", err);
        document.getElementById("id_cat").innerHTML = '<option value="">تعذر تحميل الأصناف</option>';
    }
}

// 4. تحميل المنتجات من جدول products في Supabase
async function loadProducts(){
    try {
        const { data, error } = await supabaseClient
            .from('products')
            .select('*')
            .order('id_product', { ascending: false });

        if (error) throw error;
        products = data || [];
        renderTable(products);
    } catch (err) {
        console.error("خطأ في تحميل المنتجات:", err);
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="9" style="color:red;">خطأ أثناء جلب البيانات: ${err.message}</td></tr>`;
    }
}

// 5. عرض جدول المنتجات
function renderTable(list){
    if (!list || list.length === 0) {
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="9">لا توجد منتجات مسجلة.</td></tr>`;
        return;
    }

    let html = "";

    list.forEach(p => {
        const catObj = categories.find(c => c.id_cat == p.id_cat);
        const catName = catObj ? (catObj.description_cat || catObj.name_cat) : (p.id_cat || '-');
        const deptInfo = p.department ? ` (${p.department})` : '';
        const img = p.image_url ? p.image_url : fallbackImg;

        html += `
        <tr>
        <td><img src="${img}" class="prod-img" onerror="this.src='${fallbackImg}'"></td>
        <td>${p.id_product}</td>
        <td><strong>${p.product_name || 'بدون اسم'}</strong></td>
        <td>${p.qte_in_stock || 0}</td>
        <td>${Number(p.seal_price || 0).toFixed(2)}</td>
        <td>${Number(p.commission || 0).toFixed(2)}</td>
        <td>${catName}${deptInfo}</td>
        <td><button class="edit" onclick="editProduct(${p.id_product})">تعديل</button></td>
        <td><button class="delete" onclick="deleteProduct(${p.id_product})">حذف</button></td>
        </tr>`;
    });
    document.getElementById("tableBody").innerHTML = html;
}

// 6. حفظ أو تعديل المنتج
async function saveProduct(){
    const productName = document.getElementById("product_name").value.trim();
    if (!productName) {
        alert("يرجى إدخال اسم المنتج");
        return;
    }

    let payQte = Number(document.getElementById("pay_qte").value) || 0;
    let piceQte = Number(document.getElementById("pice_qte").value) || 0;
    let stockInput = Number(document.getElementById("qte_in_stock").value);
    let stockCalculated = (stockInput || stockInput === 0) ? stockInput : (payQte * piceQte);

    let data = {
        product_name: productName,
        pay_qte: payQte,
        pice_qte: piceQte,
        qte_in_stock: stockCalculated,
        pay_price: Number(document.getElementById("pay_price").value) || 0,
        seal_price: Number(document.getElementById("seal_price").value) || 0,
        commission: Number(document.getElementById("commission").value) || 0,
        pay_date: document.getElementById("pay_date").value || null,
        expare_date: document.getElementById("expare_date").value || null,
        req_id: document.getElementById("req_id").value || null,
        coasts_value: Number(document.getElementById("coasts_value").value) || 0,
        id_cat: document.getElementById("id_cat").value ? Number(document.getElementById("id_cat").value) : null,
        department: document.getElementById("department").value || null,
        image_url: document.getElementById("image_url").value || null
    };

    try {
        let error;
        if(edit_id == null){
            // إضافة منتج جديد
            const res = await supabaseClient.from('products').insert([data]);
            error = res.error;
        } else {
            // تحديث منتج موجود
            const res = await supabaseClient.from('products').update(data).eq('id_product', edit_id);
            error = res.error;
        }

        if(error) throw error;

        alert(edit_id ? "تم تعديل المنتج بنجاح!" : "تم حفظ المنتج بنجاح!");
        clearForm();
        loadProducts();
    } catch(err) {
        alert("خطأ أثناء الحفظ: " + err.message);
    }
}

// 7. تعبئة النموذج للتعديل
function editProduct(id){
    let p = products.find(x => x.id_product == id);
    if(!p) return;

    document.getElementById("product_name").value = p.product_name || "";
    document.getElementById("pay_qte").value = p.pay_qte || "";
    document.getElementById("pice_qte").value = p.pice_qte || "";
    document.getElementById("qte_in_stock").value = p.qte_in_stock || 0;
    document.getElementById("pay_price").value = p.pay_price || "";
    document.getElementById("seal_price").value = p.seal_price || "";
    document.getElementById("commission").value = p.commission || "";

    if(p.pay_date) document.getElementById("pay_date").value = p.pay_date.split('T')[0];
    else document.getElementById("pay_date").value = "";

    if(p.expare_date) document.getElementById("expare_date").value = p.expare_date.split('T')[0];
    else document.getElementById("expare_date").value = "";

    document.getElementById("req_id").value = p.req_id || "";
    document.getElementById("coasts_value").value = p.coasts_value || "";
    document.getElementById("id_cat").value = p.id_cat || "";
    document.getElementById("department").value = p.department || "";
    
    // ضبط معايرة وحقل الصورة
    setPreviewImage(p.image_url || "");

    edit_id = id;
    document.getElementById("btnSave").textContent = "تحديث البيانات";
    document.getElementById("btnSave").style.background = "#ffc107";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 8. حذف منتج
async function deleteProduct(id){
    if(!confirm(`تأكيد حذف المنتج رقم #${id}؟`)) return;
    try {
        const { error } = await supabaseClient.from('products').delete().eq('id_product', id);
        if(error) throw error;

        alert("تم الحذف بنجاح");
        loadProducts();
    } catch (err) {
        alert("خطأ عند الحذف: " + err.message);
    }
}

// 9. بحث
function searchProduct(){
    let word = document.getElementById("searchBox").value.toLowerCase().trim();
    let filtered = products.filter(p =>
        (p.product_name && p.product_name.toLowerCase().includes(word)) ||
        (p.department && p.department.toLowerCase().includes(word)) ||
        (p.id_product && p.id_product.toString().includes(word))
    );
    renderTable(filtered);
}

// 10. مسح الحقول
function clearForm(){
    document.querySelectorAll(".grid input").forEach(i => i.value = "");
    document.getElementById("id_cat").value = "";
    setPreviewImage("");
    edit_id = null;
    document.getElementById("btnSave").textContent = "حفظ المنتج";
    document.getElementById("btnSave").style.background = "#28a745";
}

// 11. خروج
function logout(){
    window.location.href = "index.html";
}

// بدء التحميل عند فتح الصفحة
async function init() {
    await loadCategories();
    await loadProducts();
}

init();

</script>

</body>
</html>
