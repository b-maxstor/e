<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة متجر B-Max - تسجيل الدخول</title>

<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Font Awesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Fonts (Cairo) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --primary-color: #0d9488;
    --primary-hover: #0f766e;
    --accent-color: #3b82f6;
    --bg-gradient-start: #0f172a;
    --bg-gradient-end: #1e293b;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo', sans-serif;
    background: radial-gradient(circle at top right, #1e293b, #0f172a);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:auto;
}

/* ===== الكرت الرئيسي ===== */

.container{
    width:1050px;
    max-width:100%;
    min-height:620px;
    display:flex;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius:24px;
    overflow:hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

/* ===== الجهة اليسرى (لوحة المعلومات) ===== */

.left{
    width:48%;
    position:relative;
    background: linear-gradient(135deg, rgba(13, 148, 136, 0.85), rgba(30, 41, 59, 0.95)), 
                url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?q=80&w=1600&auto=format&fit=crop") center/cover;
    display:flex;
    align-items:flex-end;
    padding:45px;
    color:white;
}

.left-content{
    position:relative;
    z-index:2;
}

.brand{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    background: rgba(255, 255, 255, 0.15);
    border:1px solid rgba(255, 255, 255, 0.2);
    border-radius:30px;
    font-size:13px;
    font-weight: 600;
    margin-bottom:20px;
    backdrop-filter:blur(10px);
}

.left h2{
    font-size:34px;
    line-height:1.4;
    margin-bottom:14px;
    font-weight:800;
    color: #ffffff;
}

.left p{
    font-size:15px;
    line-height:1.9;
    color:rgba(255,255,255,0.85);
}

/* ===== الجهة اليمنى (نموذج الدخول) ===== */

.right{
    width:52%;
    background:#ffffff;
    padding:50px 45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
}

/* الشعار */

.logo{
    width:65px;
    height:65px;
    border-radius:18px;
    background: linear-gradient(135deg, var(--primary-color), #0284c7);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:26px;
    margin:0 auto 20px;
    box-shadow: 0 10px 20px rgba(13, 148, 136, 0.3);
}

/* العنوان */

h1{
    text-align:center;
    font-size:28px;
    color: var(--text-main);
    margin-bottom:8px;
    font-weight: 800;
}

.subtitle{
    text-align:center;
    color: var(--text-muted);
    margin-bottom:30px;
    font-size:14px;
}

/* الحقول */

.input-group{
    margin-bottom:20px;
}

.label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:#334155;
}

.input-box{
    position:relative;
    display: flex;
    align-items: center;
}

.input-box i.input-icon{
    position: absolute;
    right: 16px;
    color: #94a3b8;
    font-size: 16px;
    transition: 0.3s;
}

.input-box input{
    width:100%;
    padding:14px 45px 14px 16px;
    border-radius:12px;
    border:1.5px solid var(--border-color);
    font-size:14px;
    background:#f8fafc;
    transition: all 0.3s ease;
    font-family:'Cairo', sans-serif;
    color: #0f172a;
}

.input-box input:focus{
    outline:none;
    background:#ffffff;
    border-color: var(--primary-color);
    box-shadow:0 0 0 4px rgba(13, 148, 136, 0.15);
}

.input-box input:focus + i.input-icon {
    color: var(--primary-color);
}

.toggle-password {
    position: absolute;
    left: 16px;
    cursor: pointer;
    color: #94a3b8;
    transition: 0.3s;
}

.toggle-password:hover {
    color: var(--primary-color);
}

/* الزر */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background: linear-gradient(135deg, var(--primary-color), #0284c7);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition: all 0.3s ease;
    margin-top:10px;
    font-family:'Cairo', sans-serif;
    box-shadow: 0 10px 20px rgba(13, 148, 136, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

button:hover{
    transform:translateY(-2px);
    box-shadow: 0 12px 24px rgba(13, 148, 136, 0.35);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

/* معلومات */

.footer-text{
    margin-top:30px;
    text-align:center;
    font-size:12px;
    color:#94a3b8;
    line-height:1.8;
}

/* ===== التجاوب للموبايل والأجهزة المختلفة ===== */

@media(max-width:950px){
    .container{
        flex-direction:column;
        min-height:auto;
    }

    .left{
        width:100%;
        min-height:220px;
        padding:30px;
    }

    .right{
        width:100%;
        padding:35px 25px;
    }

    .left h2{
        font-size:26px;
    }

    h1{
        font-size:24px;
    }
}

@media(max-width:480px){
    body{
        padding:10px;
    }

    .container{
        border-radius:18px;
    }

    .left{
        min-height:180px;
        padding:20px;
    }

    .left h2{
        font-size:20px;
    }

    .left p{
        font-size:13px;
    }

    .right{
        padding:25px 18px;
    }

    .logo{
        width:55px;
        height:55px;
        font-size:22px;
        border-radius:14px;
    }

    h1{
        font-size:22px;
    }

    .subtitle{
        font-size:13px;
        margin-bottom:20px;
    }

    .input-box input{
        padding:12px 40px 12px 14px;
        font-size:13px;
    }

    button{
        padding:13px;
        font-size:15px;
    }
}

/* تحسين شريط التمرير */
::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background: var(--primary-color);
    border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

    <!-- الجهة اليسرى -->
    <div class="left">
        <div class="left-content">
            <div class="brand">
                <i class="fa-solid fa-rocket"></i> نظام حديث لإدارة المبيعات
            </div>

            <h2>
                إدارة ذكية<br>
                للمبيعات والمستخدمين
            </h2>

            <p>
                واجهة احترافية متوافقة مع الجوال والأجهزة الحديثة
                لتسهيل إدارة العمليات اليومية بسرعة وأمان.
            </p>
        </div>
    </div>

    <!-- الجهة اليمنى -->
    <div class="right">

        <div class="logo">
            <i class="fa-solid fa-briefcase"></i>
        </div>

        <h1>تسجيل الدخول</h1>

        <div class="subtitle">
            مرحباً بك في إدارة المتجر
        </div>

        <div class="input-group">
            <label class="label">اسم المستخدم</label>
            <div class="input-box">
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="off">
                <i class="fa-regular fa-user input-icon"></i>
            </div>
        </div>

        <div class="input-group">
            <label class="label">كلمة المرور</label>
            <div class="input-box">
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
                <i class="fa-solid fa-lock input-icon"></i>
                <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
            </div>
        </div>

        <button id="btnLogin" onclick="login()">
            <span>تسجيل الدخول</span>
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="footer-text">
            جميع الحقوق محفوظة © ABM للبرمجة والتصميم
        </div>

    </div>

</div>

<script>

// إظهار وإخفاء كلمة المرور
function togglePasswordVisibility() {
    const passwordInput = document.getElementById("password");
    const toggleIcon = document.querySelector(".toggle-password");
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.classList.remove("fa-eye");
        toggleIcon.classList.add("fa-eye-slash");
    } else {
        passwordInput.type = "password";
        toggleIcon.classList.remove("fa-eye-slash");
        toggleIcon.classList.add("fa-eye");
    }
}

// استخدام مشروع Supabase الخاص بك المحدث
const supabaseClient = window.supabase.createClient(
    "https://ihlwkwiimimoiplfqcdk.supabase.co",
    "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
);

// دعم زر Enter
document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        login();
    }
});

async function login() {

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
        alert("الرجاء إدخال اسم المستخدم وكلمة المرور");
        return;
    }

    try {
        // تغيير زر الدخول لحالة التحميل
        btnLogin.disabled = true;
        btnLogin.innerHTML = `<span>جاري التحقق...</span> <i class="fa-solid fa-spinner fa-spin"></i>`;

        const { data, error } = await supabaseClient
            .from("tb_users")
            .select("*")
            .eq("username", username)
            .eq("pwd", password)
            .maybeSingle();

        if (error) {
            console.error(error);
            alert("حدث خطأ أثناء الاتصال بقاعدة البيانات");
            btnLogin.disabled = false;
            btnLogin.innerHTML = `<span>تسجيل الدخول</span> <i class="fa-solid fa-arrow-left"></i>`;
            return;
        }

        if (!data) {
            alert("اسم المستخدم أو كلمة المرور غير صحيحة");
            btnLogin.disabled = false;
            btnLogin.innerHTML = `<span>تسجيل الدخول</span> <i class="fa-solid fa-arrow-left"></i>`;
            return;
        }

        // 1. حفظ كائن المستخدم كاملاً للتعامل معه بسهولة
        localStorage.setItem("user", JSON.stringify(data));

        // 2. حفظ القيم المنفصلة للتوافق مع صفحات قديمة
        localStorage.setItem("userId", data.id || "");
        localStorage.setItem("userName", data.fullname || data.username || "");
        localStorage.setItem("userRole", data.usertype || "");
        localStorage.setItem("bankAccount", data.bank_account || "");

        // التوجيه حسب نوع المستخدم
        const userType = (data.usertype || "").trim();

        switch (userType) {

            case "مسوق":
            case "مدير":
            case "مشرف":
            case "تقني حاسوب":
            case "بائع":
                // التوجيه المباشر للوحة التحكم الرئيسية dashboard.html
                window.location.href = "dashboard.html";
                break;

            default:
                // التوجيه الافتراضي لوحة التحكم الرئيسية
                window.location.href = "dashboard.html";
                break;

        }

    } catch (err) {

        console.error("Login Error:", err);
        alert("حدث خطأ أثناء تسجيل الدخول");
        btnLogin.disabled = false;
        btnLogin.innerHTML = `<span>تسجيل الدخول</span> <i class="fa-solid fa-arrow-left"></i>`;

    }

}

</script>

</body>
</html>
