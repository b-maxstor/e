<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات والدفع</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">🛒 سلة المشتريات وإنهاء الطلب</h1>
            <a href="store.html" class="text-blue-600 font-bold hover:underline text-sm">⬅️ العودة للمتجر</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- قائمة المنتجات بالسلة -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">المنتجات المطلوبة</h2>
                <div id="cartItems" class="space-y-4 max-h-80 overflow-y-auto mb-4"></div>
                <div class="border-t pt-3 flex justify-between font-extrabold text-lg">
                    <span>الإجمالي:</span>
                    <span id="cartTotal" class="text-blue-600">0.00 ج.س</span>
                </div>
            </div>

            <!-- نموذج بيانات الشحن -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">📦 بيانات الشحن والتوصيل</h2>
                <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">اسم العميل *</label>
                        <input type="text" id="client_name" required class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">رقم الهاتف الأساسي *</label>
                        <input type="tel" id="client_phone" required placeholder="09xxxxxxx" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">رقم هاتف إضافي (احتياطي)</label>
                        <input type="tel" id="client_second_phone" placeholder="01xxxxxxx" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">العنوان بالتفصيل *</label>
                        <input type="text" id="client_address" required placeholder="المدينة، الحي، الشارع..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button type="submit" id="btnSubmit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition text-sm cursor-pointer mt-4">
                        ✅ تأكيد وإرسال الطلب
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://hjcaocvhzeejmglzjuub.supabase.co",
            "sb_publishable_fLbGeBPrc94jjWEL0mZRbg_tNdOhFnd"
        );

        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];

        function renderCart() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-4">السلة فارغة</p>`;
                document.getElementById('cartTotal').innerText = '0.00 ج.س';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = (item.seal_price || 0) * (item.quantity || 1);
                total += itemTotal;
                html += `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                    <div>
                        <div class="font-bold text-sm">${item.product_name}</div>
                        <div class="text-xs text-gray-500">${item.seal_price} × ${item.quantity}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-blue-600">${itemTotal.toFixed(2)}</span>
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 font-bold text-xs">❌</button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('cartTotal').innerText = total.toFixed(2) + ' ج.س';
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('customerCart', JSON.stringify(cart));
            renderCart();
        }

        async function submitOrder(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "جاري حفظ الطلب...";

            const total = cart.reduce((sum, item) => sum + ((item.seal_price || 0) * (item.quantity || 1)), 0);

            try {
                // 1. إضافة سجل الطلب الرئيسي في web_orders
                const { data: orderData, error: orderError } = await supabaseClient
                    .from('web_orders')
                    .insert([{
                        client_name: document.getElementById('client_name').value,
                        client_phone: document.getElementById('client_phone').value,
                        client_second_phone: document.getElementById('client_second_phone').value || null,
                        client_address: document.getElementById('client_address').value,
                        total_amount: total,
                        order_status: 'قيد المراجعة'
                    }])
                    .select('id_web_order')
                    .single();

                if (orderError) throw orderError;

                const newOrderId = orderData.id_web_order;

                // 2. تجهيز وسجل تفاصيل المنتجات لجدول web_order_details
                const orderDetails = cart.map(item => ({
                    id_web_order: newOrderId,
                    id_product: item.id_product,
                    product_name: item.product_name,
                    qte: item.quantity,
                    price: item.seal_price,
                    amount: item.seal_price * item.quantity,
                    commission: 0 // يمكن حساب العمولة لاحقاً
                }));

                const { error: detailsError } = await supabaseClient
                    .from('web_order_details')
                    .insert(orderDetails);

                if (detailsError) throw detailsError;

                alert("🎉 تم إرسال طلبك بنجاح! رقم الطلب: " + newOrderId);
                localStorage.removeItem('customerCart');
                window.location.href = 'store.html';

            } catch (err) {
                console.error("خطأ أثناء حفظ الطلب:", err);
                alert("حدث خطأ أثناء حفظ الطلب: " + err.message);
                btn.disabled = false;
                btn.innerText = "✅ تأكيد وإرسال الطلب";
            }
        }

        renderCart();
    </script>
</body>
</html>
